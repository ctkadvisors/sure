name: Homelab validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or branch in this fork to validate
        required: true
        default: main
        type: string
      run_mode:
        description: Validation scope
        required: true
        default: full
        type: choice
        options:
          - full
          - focused
          - lockfile
      test_paths:
        description: Space-separated Minitest paths for focused mode
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sure-homelab-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: homelab
    timeout-minutes: 90
    container:
      image: ruby:3.4.9-bookworm
    env:
      RAILS_ENV: test
      DB_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      SELENIUM_REMOTE_URL: http://selenium:4444
      DISABLE_PARALLELIZATION: "true"
      PLAID_CLIENT_ID: foo
      PLAID_SECRET: bar
      BUNDLE_JOBS: "3"
      BUNDLE_RETRY: "3"
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-bookworm
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      selenium:
        image: selenium/standalone-chromium:latest
        options: --shm-size=2g
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Record source and runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          ruby --version
      - name: Install disposable container dependencies
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y libvips42 libpq-dev postgresql-client libyaml-dev poppler-utils
          gem install bundler -v 2.6.7 --no-document
          bundle _2.6.7_ install
      - name: Record resolved lockfile when changed
        run: |
          if ! git diff --quiet -- Gemfile.lock; then
            echo 'SURE_LOCKFILE_BASE64_BEGIN'
            ruby -rbase64 -e 'puts Base64.strict_encode64(File.binread("Gemfile.lock"))'
            echo 'SURE_LOCKFILE_BASE64_END'
          fi
      - name: Set up Node in disposable container
        if: ${{ inputs.run_mode == 'full' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Install JavaScript dependencies
        if: ${{ inputs.run_mode == 'full' }}
        run: npm ci
      - name: Prepare disposable test database
        if: ${{ inputs.run_mode != 'lockfile' }}
        run: bin/rails db:create db:schema:load db:seed
      - name: Focused Rails behavioral tests
        if: ${{ inputs.run_mode == 'focused' }}
        shell: bash
        env:
          TEST_PATHS: ${{ inputs.test_paths }}
        run: |
          read -r -a paths <<< "$TEST_PATHS"
          test "${#paths[@]}" -gt 0
          bin/rails test "${paths[@]}"
      - name: Full Rails behavioral suite
        if: ${{ inputs.run_mode == 'full' }}
        run: bin/rails test
      - name: Encryption tests
        if: ${{ !cancelled() && inputs.run_mode == 'full' }}
        shell: bash
        env:
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test
        run: |
          mapfile -t files < <(grep -rl --include='*_test.rb' 'encryption_ready?' test | sort)
          test "${#files[@]}" -gt 0
          bin/rails test "${files[@]}"
      - name: Full browser system suite
        if: ${{ !cancelled() && inputs.run_mode == 'full' }}
        run: bin/rails test:system
      - name: Ruby lint
        if: ${{ !cancelled() && inputs.run_mode == 'full' }}
        run: bin/rubocop -f github
      - name: ERB lint
        if: ${{ !cancelled() && inputs.run_mode == 'full' }}
        run: bundle exec erb_lint ./app/**/*.erb
      - name: Biome lint
        if: ${{ !cancelled() && inputs.run_mode == 'full' }}
        run: npm run lint
      - name: Security analysis
        if: ${{ !cancelled() && inputs.run_mode == 'full' }}
        run: bin/brakeman --no-pager
