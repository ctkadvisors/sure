name: Homelab validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or branch in this fork to validate
        required: true
        default: main
        type: string
      runner_label:
        description: Existing dedicated homelab CI pool
        required: true
        default: homelab
        type: choice
        options:
          - homelab
          - homelab-arm64
      run_mode:
        description: Validation scope
        required: true
        default: full
        type: choice
        options:
          - full
          - focused
          - lockfile
      test_paths:
        description: Space-separated Minitest paths for focused mode
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sure-homelab-validation-${{ inputs.run_mode }}-${{ inputs.source_ref }}-${{ inputs.runner_label }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 90
    container:
      image: ruby:3.4.9-bookworm
    env:
      RAILS_ENV: test
      DB_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      SELENIUM_REMOTE_URL: http://selenium:4444
      DISABLE_PARALLELIZATION: "true"
      PLAID_CLIENT_ID: foo
      PLAID_SECRET: bar
      BUNDLE_JOBS: "3"
      BUNDLE_RETRY: "3"
    services:
      postgres:
        image: ${{ inputs.run_mode != 'lockfile' && 'postgres:16-bookworm' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ${{ inputs.run_mode != 'lockfile' && 'redis:7-bookworm' || '' }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      selenium:
        image: ${{ inputs.run_mode == 'full' && 'selenium/standalone-chromium@sha256:c7c17cd79c62819a8329df00e610dbc4073c279da034a6f37135d454eb0d8870' || '' }}
        options: --shm-size=2g
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Record source and runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          ruby --version
      - name: Install disposable container dependencies
        id: ruby_dependencies
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y libvips42 libpq-dev postgresql-client libyaml-dev poppler-utils
          gem install bundler -v 2.6.7 --no-document
          bundle _2.6.7_ install
      - name: Record resolved lockfile when changed
        run: |
          if ! git diff --quiet -- Gemfile.lock; then
            echo 'SURE_LOCKFILE_BASE64_BEGIN'
            ruby -rbase64 -e 'puts Base64.strict_encode64(File.binread("Gemfile.lock"))'
            echo 'SURE_LOCKFILE_BASE64_END'
          fi
      - name: Set up Node in disposable container
        if: ${{ inputs.run_mode != 'lockfile' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: JavaScript service worker tests
        if: ${{ inputs.run_mode != 'lockfile' && hashFiles('test/javascript/*web_push*.mjs') != '' }}
        run: node --test test/javascript/*web_push*.mjs
      - name: Prepare disposable test database
        id: database
        if: ${{ !cancelled() && inputs.run_mode != 'lockfile' && steps.ruby_dependencies.outcome == 'success' }}
        run: bin/rails db:create db:schema:load db:migrate db:seed
      - name: Record generated database schema when changed
        if: ${{ !cancelled() && inputs.run_mode != 'lockfile' && steps.database.outcome == 'success' }}
        run: |
          if ! git diff --quiet -- db/schema.rb; then
            echo 'SURE_SCHEMA_BASE64_BEGIN'
            ruby -rbase64 -e 'puts Base64.strict_encode64(File.binread("db/schema.rb"))'
            echo 'SURE_SCHEMA_BASE64_END'
          fi
      - name: Build styles for behavioral and browser tests
        id: styles
        if: ${{ !cancelled() && inputs.run_mode != 'lockfile' && steps.database.outcome == 'success' }}
        run: bin/rails tailwindcss:build
      - name: Critical Rails behavioral tests
        id: critical_rails
        if: ${{ !cancelled() && inputs.run_mode != 'lockfile' && steps.database.outcome == 'success' && steps.styles.outcome == 'success' }}
        shell: bash
        env:
          TEST_PATHS: ${{ inputs.test_paths }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: |
          if [ "$RUN_MODE" = full ]; then
            paths=(
              test/models/web_push_subscription_test.rb
              test/models/web_push/client_test.rb
              test/controllers/web_push_subscriptions_controller_test.rb
              test/jobs/deliver_web_push_notification_job_test.rb
              test/controllers/settings/preferences_controller_test.rb
              test/jobs/generate_insights_job_test.rb
              test/controllers/pwa_controller_test.rb
              test/jobs/deliver_insight_notification_job_test.rb
              test/models/session_test.rb
            )
          else
            read -r -a paths <<< "$TEST_PATHS"
          fi
          test "${#paths[@]}" -gt 0
          bin/rails test "${paths[@]}"
      - name: Critical browser system tests
        id: critical_system
        if: ${{ !cancelled() && inputs.run_mode == 'full' && steps.critical_rails.outcome == 'success' }}
        run: bin/rails test test/system/web_push_notifications_test.rb
      - name: Full Rails behavioral suite
        if: ${{ !cancelled() && inputs.run_mode == 'full' && steps.critical_rails.outcome == 'success' && steps.critical_system.outcome == 'success' }}
        env:
          DISABLE_PARALLELIZATION: "false"
          PARALLEL_WORKERS: "2"
        run: bin/rails test
      - name: Encryption tests
        if: ${{ !cancelled() && inputs.run_mode == 'full' && steps.critical_rails.outcome == 'success' && steps.critical_system.outcome == 'success' }}
        shell: bash
        env:
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test
        run: |
          mapfile -t files < <(grep -rl --include='*_test.rb' 'encryption_ready?' test | sort)
          test "${#files[@]}" -gt 0
          bin/rails test "${files[@]}"
      - name: Full browser system suite
        if: ${{ !cancelled() && inputs.run_mode == 'full' && steps.critical_rails.outcome == 'success' && steps.critical_system.outcome == 'success' }}
        run: bin/rails test:system
      - name: Ruby lint
        if: ${{ !cancelled() && inputs.run_mode != 'lockfile' }}
        run: bin/rubocop -f github
      - name: ERB lint
        if: ${{ !cancelled() && inputs.run_mode != 'lockfile' }}
        shell: bash
        run: |
          shopt -s globstar
          bundle exec erb_lint ./app/**/*.erb
      - name: Install JavaScript dependencies
        if: ${{ !cancelled() && inputs.run_mode != 'lockfile' && inputs.runner_label == 'homelab' }}
        run: |
          getent ahostsv4 registry.npmjs.org || true
          npm ci
      - name: Biome lint
        if: ${{ !cancelled() && inputs.run_mode != 'lockfile' && inputs.runner_label == 'homelab' }}
        run: npm run lint
      - name: Security analysis
        if: ${{ !cancelled() && inputs.run_mode != 'lockfile' }}
        run: bin/brakeman --no-pager
